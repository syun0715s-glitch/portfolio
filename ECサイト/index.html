/* ================================
   LOCAL STORAGE
================================ */

let cartItems =
  JSON.parse(
    localStorage.getItem("cartItems") || "[]"
  );

let favorites =
  JSON.parse(
    localStorage.getItem("favorites") || "[]"
  );


/* ================================
   CART
================================ */

function updateCart(){

  const cartCount =
    cartItems.reduce(
      (sum,item) =>
        sum + item.quantity,
      0
    );

  const total =
    cartItems.reduce(
      (sum,item) =>
        sum +
        item.price *
        item.quantity,
      0
    );

  localStorage.setItem(
    "cartItems",
    JSON.stringify(cartItems)
  );

  localStorage.setItem(
    "cart",
    cartCount
  );

  localStorage.setItem(
    "total",
    total
  );

  const element =
    document.getElementById(
      "cartCount"
    );

  if(element){
    element.textContent = cartCount;
  }

}

updateCart();


/* ================================
   RENDER
================================ */

function renderProducts(list){

  const grid =
    document.getElementById(
      "productGrid"
    );

  if(!grid){
    return;
  }

  grid.innerHTML = "";

  if(list.length === 0){

    grid.innerHTML = `
      <div class="empty">
        商品が見つかりません
      </div>
    `;

    return;
  }

  list.forEach(product => {

    const favorite =
      favorites.includes(
        product.name
      );

      product.stock <= 5

    card.innerHTML = `

/* ================================
   FILTER
================================ */

function filterProducts(){

  const keyword =
    document
      .getElementById("searchProduct")
      .value
      .toLowerCase()
      .trim();

  const category =
    document
      .getElementById("categoryFilter")
      .value;

  const sort =
    document
      .getElementById("sortFilter")
      .value;

  let result =
    products.filter(product => {

      const matchName =
        product.name
          .toLowerCase()
          .includes(keyword);

      const matchCategory =
        category === "all" ||
        product.category === category;

      return matchName && matchCategory;

    });

  if(sort === "price-low"){

    result.sort(
      (a,b) =>
        a.price - b.price
    );

  }

  if(sort === "price-high"){

    result.sort(
      (a,b) =>
        b.price - a.price
    );

  }

  if(sort === "stock"){

    result.sort(
      (a,b) =>
        b.stock - a.stock
    );

  }

  renderProducts(result);

}

renderProducts(products);

document
  .getElementById("searchProduct")
  .addEventListener(
    "input",
    filterProducts
  );

document
  .getElementById("categoryFilter")
  .addEventListener(
    "change",
    filterProducts
  );

document
  .getElementById("sortFilter")
  .addEventListener(
    "change",
    filterProducts
  );

/* ================================
   ADD CART
================================ */

function addCart(name,quantity){

  const product =
    products.find(
      item =>
        item.name === name
    );

  if(!product){
    return;
  }

  if(product.stock <= 0){

    alert(
      "申し訳ありません。\n" +
      "この商品は在庫切れです。"
    );

    return;
  }

  if(quantity > product.stock){

    alert(
      "在庫は" +
      product.stock +
      "点までです。"
    );

    return;
  }

  const existing =
    cartItems.find(
      item =>
        item.name === name
    );

  if(existing){

    if(
      existing.quantity +
      quantity >
      product.stock
    ){

      alert(
        "在庫数を超えています。"
      );

      return;

    }

    existing.quantity += quantity;

  }else{

    cartItems.push({

      name:name,

      price:product.price,

      image:product.image,

      quantity:quantity

    });

  }

  updateCart();

  alert(
    "🛒 カートに追加しました！\n\n" +
    name +
    "\n数量：" +
    quantity
  );

}

/* ================================
   QUANTITY
================================ */

function changeQuantity(index,amount){

  const item =
    cartItems[index];

  if(!item){
    return;
  }

  const product =
    products.find(
      p =>
        p.name === item.name
    );

  if(!product){
    return;
  }

  if(
    amount > 0 &&
    item.quantity + amount >
    product.stock
  ){

    alert(
      "現在の在庫は" +
      product.stock +
      "点です。"
    );

    return;

  }

  item.quantity += amount;

  if(item.quantity <= 0){

    cartItems.splice(
      index,
      1
    );

  }

  updateCart();

  if(cartItems.length === 0){
    goHome();
  }else{
    showCart();
  }

}


/* ================================
   REMOVE
================================ */

function removeCartItem(index){

  if(!cartItems[index]){
    return;
  }

  cartItems.splice(
    index,
    1
  );

  updateCart();

  if(cartItems.length === 0){

  showCart();

}else{

  showCart();

}

}


/* ================================
   RESET
================================ */

function resetCart(){

  if(cartItems.length === 0){

    alert(
      "カートはすでに空です"
    );

    return;

  }

  if(
    !confirm(
      "カートを空にしますか？"
    )
  ){

    return;

  }

  cartItems = [];

  updateCart();

  alert(
    "カートを空にしました"
  );

}

/* ================================
   BUY NOW
================================ */

function buyNow(name){

  const quantity =
    Number(
      document
        .getElementById(
          "detailQuantity"
        )
        .value
    );

  const product =
    products.find(
      item =>
        item.name === name
    );

  if(!product){
    return;
  }

  if(
    !quantity ||
    quantity < 1
  ){

    alert(
      "数量を入力してください。"
    );

    return;

  }

  if(
    quantity >
    product.stock
  ){

    alert(
      "在庫は" +
      product.stock +
      "点までです。"
    );

    return;

  }

  cartItems = [

    {
      name:product.name,
      price:product.price,
      image:product.image,
      quantity:quantity
    }

  ];

  updateCart();

  checkout();

}

  const address =
    document.getElementById("address").value;

  const payment =
    document.getElementById("payment").value;

    cartItems.reduce(
      (sum,item) =>
        sum + item.price * item.quantity,
      0
    );

  const orderNumber =
    "AOKICKS-" +
    Date.now().toString().slice(-6);

  /* 在庫を減らす */

  cartItems.forEach(item => {

    const product =
      products.find(
        p => p.name === item.name
      );

    if(product){

      product.stock =
        Math.max(
          0,
          product.stock - item.quantity
        );

    }

  });

  /* カートを空にする */

  cartItems = [];

  updateCart();

  /* 注文完了画面 */

  document.body.innerHTML = `
